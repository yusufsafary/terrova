<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terrova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --ink:     #0E0D0B;
  --ink-2:   #1C1A16;
  --ink-3:   #2E2B24;
  --warm-5:  #4A4438;
  --warm-4:  #7A7162;
  --warm-3:  #B0A58E;
  --warm-2:  #DDD4C0;
  --warm-1:  #F2EDE3;
  --canvas:  #F7F3EB;
  --white:   #FFFFFF;
  --green:   #2A5C45;
  --green-2: #3D7A5E;
  --green-3: #5FA882;
  --green-l: #E8F2ED;
  --gold:    #B8953A;
  --gold-l:  #F0E4B8;
  --r: 16px;
  --r-lg: 22px;
}

html, body { height: 100%; background: var(--ink); overflow: hidden; }

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--canvas);
  position: relative;
  overflow: hidden;
  font-family: 'Instrument Sans', sans-serif;
}

/* ─── HEADER ─── */
.hdr {
  background: var(--ink);
  padding: 16px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
}

/* subtle grain overlay on header */
.hdr::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
}

/* ─── LOGO MARK: clean geometric ─── */
.logo-mark {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
}

.logo-wordmark {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.logo-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--white);
  letter-spacing: 0.02em;
  line-height: 1;
}

.logo-sub {
  font-size: 9.5px;
  font-weight: 300;
  color: var(--warm-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* ─── LANG BUTTON ─── */
.lang-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--ink-3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 7px 13px 7px 10px;
  cursor: pointer;
  color: var(--warm-2);
  font-family: 'Instrument Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: 0.02em;
  transition: background 0.15s;
}
.lang-pill:active { background: var(--warm-5); }
.lang-pill .flag { font-size: 15px; line-height: 1; }
.lang-pill .chevron { opacity: 0.4; font-size: 9px; margin-left: 1px; }

/* ─── LANG SHEET ─── */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(14,13,11,0.72);
  z-index: 100;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(4px);
}
.sheet-overlay.open { display: flex; animation: fadeBg 0.22s ease forwards; }

.sheet {
  background: var(--white);
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  animation: slideUp 0.28s cubic-bezier(.32,.72,0,1);
  max-height: 78dvh;
  display: flex;
  flex-direction: column;
}

.sheet-handle {
  width: 32px; height: 3px;
  background: #E0D8CC;
  border-radius: 2px;
  margin: 10px auto 0;
  flex-shrink: 0;
}

.sheet-head {
  padding: 16px 22px 14px;
  border-bottom: 1px solid #F0EBE0;
  flex-shrink: 0;
}

.sheet-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--ink);
}

.sheet-scroll { overflow-y: auto; flex: 1; }
.sheet-scroll::-webkit-scrollbar { display: none; }

.lang-list { list-style: none; padding: 6px 0 8px; }

.lang-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 22px;
  cursor: pointer;
  transition: background 0.12s;
}
.lang-item:active, .lang-item.active { background: var(--warm-1); }
.lang-item .flag { font-size: 22px; line-height: 1; }
.lang-item-copy { flex: 1; }
.lang-item-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.lang-item-native { font-size: 12px; color: var(--warm-4); margin-top: 1px; }
.lang-check { color: var(--green); font-size: 16px; opacity: 0; }
.lang-item.active .lang-check { opacity: 1; }

/* ─── CHAT SCROLL ─── */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { display: none; }

/* ─── WELCOME ─── */
.welcome {
  background: var(--ink-2);
  border-radius: var(--r-lg);
  padding: 22px 20px 20px;
  position: relative;
  overflow: hidden;
  margin-bottom: 4px;
}

/* decorative circle */
.welcome::after {
  content: '';
  position: absolute;
  right: -28px; top: -28px;
  width: 110px; height: 110px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.06);
}

.welcome-kova {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.kova-dot {
  width: 8px; height: 8px;
  background: var(--green-3);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(95,168,130,0.2);
  flex-shrink: 0;
  animation: pulse 2.5s infinite;
}

.kova-label {
  font-size: 11px;
  font-weight: 400;
  color: var(--warm-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.welcome-msg {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  font-weight: 400;
  color: var(--white);
  line-height: 1.45;
  margin-bottom: 10px;
}

.welcome-sub {
  font-size: 13px;
  font-weight: 300;
  color: var(--warm-3);
  line-height: 1.6;
}

/* ─── QUICK PROMPTS ─── */
.qs-label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--warm-4);
  padding: 0 2px;
  margin-bottom: 9px;
}

.qs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 4px;
}

.q-btn {
  background: var(--white);
  border: 1px solid #E8E2D6;
  border-radius: var(--r);
  padding: 13px 13px 11px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: all 0.15s;
}
.q-btn:active { background: var(--green-l); border-color: var(--green-3); transform: scale(0.975); }
.q-icon { font-size: 18px; line-height: 1; }
.q-text { font-size: 12px; font-weight: 400; color: var(--ink-3); line-height: 1.4; }

/* ─── MESSAGES ─── */
.row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: msgIn 0.2s ease;
}
.row.user { flex-direction: row-reverse; }

.av {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.av.ai { background: var(--ink); }
.av.user { background: var(--green); }

.bubble {
  max-width: 80%;
  padding: 12px 15px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}

.row.ai .bubble {
  background: var(--white);
  color: var(--ink);
  border-radius: 16px 16px 16px 4px;
  box-shadow: 0 1px 6px rgba(14,13,11,0.07);
}

.row.user .bubble {
  background: var(--ink);
  color: var(--warm-1);
  border-radius: 16px 16px 4px 16px;
  font-weight: 300;
}

/* ─── TYPING ─── */
.typing-dots {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 4px 2px;
}
.dot {
  width: 6px; height: 6px;
  background: var(--warm-3);
  border-radius: 50%;
  animation: blink 1.3s infinite;
}
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }

/* ─── INPUT AREA ─── */
.input-wrap {
  background: var(--white);
  border-top: 1px solid #EDE7D9;
  padding: 12px 16px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}

.new-chat {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--warm-4);
  letter-spacing: 0.04em;
  margin-bottom: 10px;
  padding: 0;
  transition: color 0.15s;
}
.new-chat:active { color: var(--green); }
.new-chat svg { opacity: 0.6; }

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--warm-1);
  border: 1.5px solid #E3DBCC;
  border-radius: 22px;
  padding: 10px 10px 10px 16px;
  transition: border-color 0.2s;
}
.input-row:focus-within { border-color: var(--green-2); }

textarea.inp {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.5;
  max-height: 96px;
  min-height: 22px;
  -webkit-appearance: none;
}
textarea.inp::placeholder { color: var(--warm-3); }

.send {
  width: 38px; height: 38px;
  background: var(--ink);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.send:active { background: var(--green); transform: scale(0.92); }
.send:disabled { background: var(--warm-2); }
.send svg { width: 16px; height: 16px; }

/* ─── ANIMATIONS ─── */
@keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(95,168,130,0.2); } 50% { box-shadow: 0 0 0 5px rgba(95,168,130,0.08); } }

@media (min-width: 431px) {
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #app { border-radius: 36px; overflow: hidden; height: 840px; max-height: 96dvh; box-shadow: 0 32px 96px rgba(0,0,0,0.45); }
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo">
      <!-- CLEAN GEOMETRIC LOGO: T shape formed by soil + seedling -->
      <svg class="logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer circle -->
        <circle cx="16" cy="16" r="15.5" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <!-- Ground bar -->
        <rect x="7" y="21" width="18" height="1.5" rx="0.75" fill="#5FA882"/>
        <!-- Stem -->
        <rect x="15.25" y="13" width="1.5" height="9" rx="0.75" fill="#5FA882"/>
        <!-- Left leaf -->
        <path d="M15.25 17 C15.25 17 10 16 9.5 11.5 C12.5 11 15.25 14 15.25 17Z" fill="#3D7A5E"/>
        <!-- Right leaf -->
        <path d="M16.75 15 C16.75 15 22 13.5 22.5 9 C19.5 9 16.75 12 16.75 15Z" fill="#5FA882"/>
      </svg>
      <div class="logo-wordmark">
        <div class="logo-name">Terrova</div>
        <div class="logo-sub">AI Farming</div>
      </div>
    </div>

    <button class="lang-pill" onclick="openSheet()">
      <span class="flag" id="hFlag">🇬🇧</span>
      <span id="hCode">EN</span>
      <span class="chevron">▾</span>
    </button>
  </header>

  <!-- CHAT -->
  <div class="chat" id="chat">

    <div class="welcome" id="welcomeCard">
      <div class="welcome-kova">
        <div class="kova-dot"></div>
        <div class="kova-label">Kova is online</div>
      </div>
      <div class="welcome-msg" id="wMsg">Hey there, farmer. What's growing today?</div>
      <div class="welcome-sub" id="wSub">Ask me anything about your crops, soil, pests, or harvest. I'll give you straight, practical advice.</div>
    </div>

    <div id="qsWrap">
      <div class="qs-label" id="qsLabel">Try asking</div>
      <div class="qs-grid" id="qsGrid"></div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <button class="new-chat" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newLabel">New conversation</span>
    </button>
    <div class="input-row">
      <textarea class="inp" id="inp" rows="1"
        placeholder="Ask about your crops..."
        oninput="resize(this)"
        onkeydown="onKey(event)"></textarea>
      <button class="send" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- LANG SHEET -->
  <div class="sheet-overlay" id="overlay" onclick="outsideClose(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title">Language</div>
      </div>
      <div class="sheet-scroll">
        <ul class="lang-list" id="langList"></ul>
      </div>
    </div>
  </div>

</div>

    qs:[{i:'🐛',t:'ተባዮችን እንዴት መቆጣጠር ይቻላል?'},{i:'💧',t:'ቲማቲም ለማጠጣት የሚሆን ሰሌዳ?'},{i:'🌱',t:'ለበቆሎ ተፈጥሮአዊ ማዳበሪያ?'},{i:'☀️',t:'ለደረቅ ወቅት ምርጥ ሰብሎች?'},{i:'💰',t:'ሩዝ መቼ ቢሸጥ ጥሩ ዋጋ ያስገኛል?'},{i:'🌾',t:'ቃሪያ ሊሰበሰብ ዝግጁ ሲሆን ምልክቱ?'}]},

let lang = 'en', history = [], busy = false;

function init() {
  buildLangList();
  buildQs();
  applyUI();
}

function buildLangList() {
  document.getElementById('langList').innerHTML = LANGS.map(l => `
    <li class="lang-item ${l.c===lang?'active':''}" onclick="pickLang('${l.c}')">
      <span class="flag">${l.f}</span>
      <div class="lang-item-copy">
        <div class="lang-item-name">${l.n}</div>
        <div class="lang-item-native">${l.nat}</div>
      </div>
      <span class="lang-check">✓</span>
    </li>`).join('');
}

function buildQs() {
  const s = STR[lang]||STR.en;
  document.getElementById('qsGrid').innerHTML = s.qs.map(q=>`
    <button class="q-btn" onclick="useQ(this)" data-t="${q.t.replace(/"/g,'&quot;')}">
      <span class="q-icon">${q.i}</span>
      <span class="q-text">${q.t}</span>
    </button>`).join('');
}

function applyUI() {
  const s = STR[lang]||STR.en;
  const l = LANGS.find(x=>x.c===lang);
  document.getElementById('hFlag').textContent = l.f;
  document.getElementById('hCode').textContent = l.c.toUpperCase();
  document.getElementById('wMsg').textContent = s.msg;
  document.getElementById('wSub').textContent = s.sub;
  document.getElementById('qsLabel').textContent = s.ql;
  document.getElementById('newLabel').textContent = s.nc;
  document.getElementById('inp').placeholder = s.ph;
}

function openSheet() { document.getElementById('overlay').classList.add('open'); }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function outsideClose(e) { if(e.target===document.getElementById('overlay')) closeSheet(); }

function pickLang(c) {
  lang = c;
  buildLangList();
  buildQs();
  applyUI();
  closeSheet();
}

function resize(el) {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,96)+'px';
}

function onKey(e) {
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
}

function useQ(btn) {
  document.getElementById('inp').value = btn.dataset.t;
  send();
}

function addMsg(role, text) {
  const c = document.getElementById('chat');
  if(history.length===0 && role==='user') {
    document.getElementById('welcomeCard').style.display='none';
    document.getElementById('qsWrap').style.display='none';
  }
  const d = document.createElement('div');
  d.className = `row ${role}`;
  const avIcon = role==='ai' ? '🌱' : '🧑';
  d.innerHTML = `
    ${role==='ai'?`<div class="av ai">${avIcon}</div>`:''}
    <div class="bubble">${text.replace(/\n/g,'<br>')}</div>
    ${role==='user'?`<div class="av user">${avIcon}</div>`:''}
  `;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  history.push({ role: role==='user'?'user':'assistant', content: text });
}

function showTyping() {
  const c = document.getElementById('chat');
  const d = document.createElement('div');
  d.className='row ai'; d.id='typer';
  d.innerHTML=`<div class="av ai">🌱</div><div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}
function hideTyping() { const t=document.getElementById('typer'); if(t) t.remove(); }

async function send() {
  if(busy) return;
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if(!txt) return;
  inp.value=''; inp.style.height='auto';
  document.getElementById('sendBtn').disabled=true;
  busy=true;
  addMsg('user', txt);
  showTyping();

  const l = LANGS.find(x=>x.c===lang);
  const sys = `You are Kova, a friendly farming AI assistant built into Terrova, a global platform for farmers. You help with practical, actionable advice on crops, soil health, pests, irrigation, harvest timing, and market prices.

Personality: warm and direct like a knowledgeable neighbor. Not a professor. Not a chatbot. A real farming friend who gets to the point fast.

Rules:
- Always respond in ${l.n} (${l.nat})
- Keep responses concise and scannable for mobile, use short paragraphs
- Use a farming emoji occasionally, not excessively
- Be honest when you do not know something specific to a region
- Never use em dashes, use commas or periods instead
- No filler phrases like "Great question!" or "Certainly!"`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system: sys,
        messages:[
          ...history.slice(-10).map(m=>({role:m.role,content:m.content})),
          {role:'user',content:txt}
        ]
      })
    });
    const data = await res.json();
    hideTyping();
    const reply = data?.content?.[0]?.text || 'Something went wrong. Please try again.';
    addMsg('ai', reply);
  } catch(e) {
    hideTyping();
    addMsg('ai','Connection issue. Check your internet and try again.');
  }
  busy=false;
  document.getElementById('sendBtn').disabled=false;
}

function newChat() {
  history=[];
  const c=document.getElementById('chat');
  c.querySelectorAll('.row').forEach(r=>r.remove());
  document.getElementById('welcomeCard').style.display='';
  document.getElementById('qsWrap').style.display='';
  document.getElementById('inp').value='';
  document.getElementById('inp').style.height='auto';
  c.scrollTop=0;
}

init();
</script>
