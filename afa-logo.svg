<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#2E7A52" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2E7A52" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="85" fill="#F5F1E8"/>

  <!-- Wheat stalks left -->
  <g transform="translate(48,110) rotate(-18)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#A67C2E" stroke-width="1.8"/>
    <ellipse cx="0" cy="-42" rx="4" ry="7" fill="#A67C2E" transform="rotate(-8)"/>
    <ellipse cx="-5" cy="-34" rx="3.5" ry="6.5" fill="#A67C2E" transform="rotate(-22)"/>
    <ellipse cx="5" cy="-34" rx="3.5" ry="6.5" fill="#A67C2E" transform="rotate(22)"/>
    <ellipse cx="-4" cy="-26" rx="3" ry="6" fill="#A67C2E" transform="rotate(-30)"/>
    <ellipse cx="4" cy="-26" rx="3" ry="6" fill="#A67C2E" transform="rotate(30)"/>
  </g>

  <!-- Wheat stalks right -->
  <g transform="translate(152,110) rotate(18)">
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#A67C2E" stroke-width="1.8"/>
    <ellipse cx="0" cy="-42" rx="4" ry="7" fill="#A67C2E" transform="rotate(8)"/>
    <ellipse cx="-5" cy="-34" rx="3.5" ry="6.5" fill="#A67C2E" transform="rotate(-22)"/>
    <ellipse cx="5" cy="-34" rx="3.5" ry="6.5" fill="#A67C2E" transform="rotate(22)"/>
    <ellipse cx="-4" cy="-26" rx="3" ry="6" fill="#A67C2E" transform="rotate(-30)"/>
    <ellipse cx="4" cy="-26" rx="3" ry="6" fill="#A67C2E" transform="rotate(30)"/>
  </g>

  <!-- Shield / crest -->
  <path d="M100 42 C100 42 72 52 72 75 L72 100 C72 118 84 130 100 136 C116 130 128 118 128 100 L128 75 C128 52 100 42 100 42Z" fill="#2E7A52"/>
  <path d="M100 50 C100 50 78 59 78 78 L78 100 C78 115 88 125 100 130 C112 125 122 115 122 100 L122 78 C122 59 100 50 100 50Z" fill="#1F5C3A"/>

  <!-- Leaf inside shield -->
  <path d="M100 68 C100 68 88 80 88 95 C88 107 93 115 100 118 C107 115 112 107 112 95 C112 80 100 68 100 68Z" fill="#4EA876" opacity=".9"/>
  <line x1="100" y1="68" x2="100" y2="118" stroke="#F5F1E8" stroke-width="1.2" opacity=".6"/>

  <!-- Text: AUSTRALIAN -->
  <text x="100" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" font-weight="700" fill="#1F5C3A" letter-spacing="2.5">AUSTRALIAN</text>
  <!-- Text: FARM -->
  <text x="100" y="169" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1F5C3A" letter-spacing="3">FARM</text>
  <!-- Text: ASSOCIATION -->
  <text x="100" y="181" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" font-weight="400" fill="#6B6250" letter-spacing="2">ASSOCIATION</text>

  <!-- Bottom decorative line -->
  <line x1="58" y1="187" x2="142" y2="187" stroke="#2E7A52" stroke-width="0.8" opacity=".5"/>
</svg>
