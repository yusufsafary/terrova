<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Terrova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --ink:     #0B0A08;
  --ink-2:   #181510;
  --ink-3:   #252119;
  --warm-5:  #3E3829;
  --warm-4:  #6B6250;
  --warm-3:  #9E9278;
  --warm-2:  #D4C9B0;
  --warm-1:  #EDE8DC;
  --canvas:  #F5F1E8;
  --white:   #FFFFFF;
  --green:   #1F5C3A;
  --green-2: #2E7A52;
  --green-3: #4EA876;
  --green-l: #E4F0EA;
  --gold:    #A67C2E;
  --gold-l:  #F5E8B8;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 24px;

  /* cat accent colors */
  --c-pests:      #D44B3A;
  --c-disease:    #8C3A4A;
  --c-soil:       #7A5228;
  --c-water:      #2A6EA6;
  --c-harvest:    #B87D18;
  --c-market:     #2A7A52;
  --c-weather:    #4A5FA0;
  --c-organic:    #3E8830;
  --c-seeds:      #9A6020;
  --c-livestock:  #A64040;
  --c-tools:      #464860;
  --c-veggies:    #2E8040;
  --c-grains:     #B8922A;
  --c-spices:     #C44020;
  --c-fruits:     #C03868;
  --c-ornamental: #7040C0;
  --c-analysis:   #1A6880;
  --c-composting: #607030;
}

html {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  height: 100%;
  width: 100%;
  position: fixed;
  top: 0; left: 0;
  background: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: -webkit-fill-available;
  max-width: 430px;
  margin: 0 auto;
  background: var(--canvas);
  position: relative;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
}

/* ── PAGE SYSTEM ── */
.page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
  transition: transform 0.38s cubic-bezier(.32,.72,0,1), opacity 0.3s ease;
  will-change: transform, opacity;
}

.page.hidden-right  { transform: translateX(100%); opacity: 0; pointer-events: none; }
.page.hidden-left   { transform: translateX(-30%);  opacity: 0; pointer-events: none; }
.page.visible       { transform: translateX(0);     opacity: 1; pointer-events: auto; }

/* ─── HEADER ─── */
.hdr {
  background: var(--ink);
  padding: 13px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.hdr::after {
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(78,168,118,.25),transparent);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.logo-mark { width: 34px; height: 34px; flex-shrink: 0; }

.logo-wordmark { display: flex; flex-direction: column; gap: 0; }

.logo-name {
  font-family: 'DM Serif Display', serif;
  font-size: 21px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: -0.01em;
  line-height: 1;
}
.logo-sub {
  font-size: 9px;
  font-weight: 400;
  color: var(--green-3);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* history button */
.hdr-right { display: flex; align-items: center; gap: 9px; }

.hist-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 100px;
  padding: 6px 11px;
  cursor: pointer;
  color: var(--warm-2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  transition: background .15s;
}
.hist-btn:active { background: rgba(255,255,255,.12); }
.hist-badge {
  display:none;
  width:16px;height:16px;border-radius:50%;
  background:var(--green-3);
  font-size:9px;font-weight:600;color:var(--ink);
  align-items:center;justify-content:center;
}
.hist-badge.show { display:flex; }

.lang-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 100px;
  padding: 6px 11px 6px 8px;
  cursor: pointer;
  color: var(--warm-2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  transition: background .15s;
}
.lang-pill:active { background: rgba(255,255,255,.12); }
.lang-pill .flag { font-size: 14px; line-height:1; }
.lang-pill .chevron { opacity:.35; font-size:9px; margin-left:1px; }

/* ── SUB-HEADER (history page) ── */
.sub-hdr {
  background: var(--ink);
  padding: 13px 18px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.sub-hdr::after {
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(78,168,118,.25),transparent);
}
.back-btn {
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.07);
  border:none;cursor:pointer;color:var(--warm-2);
  transition:background .15s;flex-shrink:0;
}
.back-btn:active { background:rgba(255,255,255,.14); }
.sub-title {
  font-family:'DM Serif Display',serif;
  font-size:18px;color:var(--white);
  font-weight:400;flex:1;
}
.clear-all {
  background:none;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-size:11.5px;color:rgba(255,255,255,.35);
  padding:4px 0;transition:color .15s;
}
.clear-all:active { color:var(--c-pests); }

/* ─── CHAT SCROLL ─── */
.chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 18px 15px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { display: none; }

/* ─── WELCOME ─── */
.welcome {
  background: var(--ink-2);
  border-radius: var(--r-xl);
  padding: 20px 18px 18px;
  position: relative;
  overflow: hidden;
  margin-bottom: 2px;
  animation: fadeUp .45s cubic-bezier(.22,.68,0,1.2) both;
}
.welcome::before {
  content:'';position:absolute;right:-44px;top:-44px;
  width:140px;height:140px;border-radius:50%;
  border:1px solid rgba(78,168,118,.07);
}
.welcome::after {
  content:'';position:absolute;right:-22px;top:-22px;
  width:82px;height:82px;border-radius:50%;
  border:1px solid rgba(78,168,118,.12);
}

.welcome-kova {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.kova-dot {
  width: 7px; height: 7px;
  background: var(--green-3);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(78,168,118,.2);
  flex-shrink: 0;
  animation: pulse 2.5s infinite;
}
.kova-label {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--warm-3);
  letter-spacing: .14em;
  text-transform: uppercase;
}
.welcome-msg {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--white);
  line-height: 1.4;
  margin-bottom: 10px;
}
.welcome-sub {
  font-size: 13px;
  font-weight: 300;
  color: var(--warm-3);
  line-height: 1.65;
}

/* ─── CAT NAV ─── */
.qs-wrap { animation: fadeUp .5s .08s cubic-bezier(.22,.68,0,1.2) both; }

.cat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .16em;
  color: var(--warm-4);
  padding: 0 2px;
  margin-bottom: 10px;
}

.cat-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 4px;
  margin-bottom: 13px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pinch-zoom;
}
.cat-scroll::-webkit-scrollbar { display: none; }

.cat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 100px;
  border: 1.5px solid #DDD7C9;
  background: var(--white);
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--warm-5);
  transition: all .2s cubic-bezier(.32,.72,0,1);
  flex-shrink: 0;
}
.cat-chip .chip-icon { font-size: 13px; line-height:1; }
.cat-chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--white);
  transform: scale(1.04);
}
.cat-chip:active { transform: scale(.95); }

/* ─── PROMPT GRID ─── */
.qs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.q-btn {
  background: var(--white);
  border: 1px solid #E5DFD1;
  border-radius: var(--r);
  padding: 12px 12px 11px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all .18s cubic-bezier(.32,.72,0,1);
  border-left-width: 3px;
  animation: fadeUp .35s cubic-bezier(.22,.68,0,1.2) both;
}
.q-btn:nth-child(1){animation-delay:.04s}
.q-btn:nth-child(2){animation-delay:.07s}
.q-btn:nth-child(3){animation-delay:.10s}
.q-btn:nth-child(4){animation-delay:.13s}
.q-btn:nth-child(5){animation-delay:.16s}
.q-btn:nth-child(6){animation-delay:.19s}
.q-btn:active { transform: scale(.97); opacity: .85; }

.q-icon { font-size: 16px; line-height: 1; }
.q-text { font-size: 12px; font-weight: 400; color: var(--ink-3); line-height: 1.4; }

/* left-border colors per cat */
.q-btn[data-cat="pests"]      { border-left-color: var(--c-pests); }
.q-btn[data-cat="disease"]    { border-left-color: var(--c-disease); }
.q-btn[data-cat="soil"]       { border-left-color: var(--c-soil); }
.q-btn[data-cat="water"]      { border-left-color: var(--c-water); }
.q-btn[data-cat="harvest"]    { border-left-color: var(--c-harvest); }
.q-btn[data-cat="market"]     { border-left-color: var(--c-market); }
.q-btn[data-cat="weather"]    { border-left-color: var(--c-weather); }
.q-btn[data-cat="organic"]    { border-left-color: var(--c-organic); }
.q-btn[data-cat="seeds"]      { border-left-color: var(--c-seeds); }
.q-btn[data-cat="livestock"]  { border-left-color: var(--c-livestock); }
.q-btn[data-cat="tools"]      { border-left-color: var(--c-tools); }
.q-btn[data-cat="veggies"]    { border-left-color: var(--c-veggies); }
.q-btn[data-cat="grains"]     { border-left-color: var(--c-grains); }
.q-btn[data-cat="spices"]     { border-left-color: var(--c-spices); }
.q-btn[data-cat="fruits"]     { border-left-color: var(--c-fruits); }
.q-btn[data-cat="ornamental"] { border-left-color: var(--c-ornamental); }
.q-btn[data-cat="analysis"]   { border-left-color: var(--c-analysis); }
.q-btn[data-cat="composting"] { border-left-color: var(--c-composting); }

/* ─── MESSAGES ─── */
.row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: msgIn .25s cubic-bezier(.22,.68,0,1.2) both;
}
.row.user { flex-direction: row-reverse; }

.av {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}
.av.ai   { background: var(--ink); color: var(--green-3); }
.av.user { background: var(--green); color: var(--white); }

.bubble {
  max-width: 80%;
  padding: 11px 14px;
  font-size: 13.5px;
  line-height: 1.65;
  word-break: break-word;
}

.row.ai .bubble {
  background: var(--white);
  color: var(--ink);
  border-radius: 16px 16px 16px 4px;
  box-shadow: 0 1px 8px rgba(11,10,8,.07);
}
.row.user .bubble {
  background: var(--ink);
  color: var(--warm-2);
  border-radius: 16px 16px 4px 16px;
  font-weight: 300;
}

.msg-time {
  font-size: 10px;
  color: var(--warm-3);
  margin-top: 3px;
  padding: 0 2px;
  align-self: flex-end;
}
.row.user .msg-time { text-align: right; }

/* ─── TYPING ─── */
.typing-dots { display:flex;gap:4px;align-items:center;padding:4px 2px; }
.dot {
  width:5px;height:5px;
  background:var(--warm-3);
  border-radius:50%;
  animation:blink 1.3s infinite;
}
.dot:nth-child(2){animation-delay:.18s}
.dot:nth-child(3){animation-delay:.36s}

/* ─── INPUT AREA ─── */
.input-wrap {
  background: var(--white);
  border-top: 1px solid #EAE4D8;
  padding: 11px 15px;
  padding-bottom: max(13px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}

.new-chat {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--warm-4);
  letter-spacing: .05em;
  margin-bottom: 9px;
  padding: 0;
  transition: color .15s;
}
.new-chat:active { color: var(--green); }
.new-chat svg { opacity:.55; }

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  background: var(--warm-1);
  border: 1.5px solid #DAD2BE;
  border-radius: 22px;
  padding: 9px 9px 9px 15px;
  transition: border-color .2s, box-shadow .2s;
}
.input-row:focus-within {
  border-color: var(--green-2);
  box-shadow: 0 0 0 3px rgba(46,122,82,.08);
}

textarea.inp {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.5;
  max-height: 96px;
  min-height: 22px;
  -webkit-appearance: none;
}
textarea.inp::placeholder { color: var(--warm-3); }

.send {
  width: 36px; height: 36px;
  background: var(--ink);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
}
.send:active { background: var(--green); transform: scale(.92); }
.send:disabled { background: var(--warm-2); }
.send svg { width:15px;height:15px; }

/* ── HISTORY PAGE ── */
.hist-page {
  background: var(--canvas);
}

.hist-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 15px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.hist-list::-webkit-scrollbar { display:none; }

.hist-empty {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  color:var(--warm-3);
  text-align:center;
  padding:40px 30px;
}
.hist-empty-icon { font-size:44px;opacity:.5; }
.hist-empty-text { font-size:14px;font-weight:300;line-height:1.6; }

.hist-session {
  background: var(--white);
  border: 1px solid #E8E2D6;
  border-radius: var(--r-lg);
  padding: 14px 15px;
  cursor: pointer;
  transition: all .18s;
  animation: fadeUp .3s cubic-bezier(.22,.68,0,1.2) both;
  position: relative;
  overflow: hidden;
}
.hist-session::before {
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--green-3);opacity:0;
  transition:opacity .15s;
}
.hist-session:active { transform:scale(.985);background:var(--warm-1); }
.hist-session:active::before { opacity:1; }

.hist-session-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
}
.hist-session-date {
  font-size:10.5px;
  font-weight:500;
  color:var(--green-2);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.hist-session-count {
  font-size:10.5px;
  color:var(--warm-3);
}
.hist-session-preview {
  font-size:13px;
  font-weight:400;
  color:var(--ink);
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.hist-session-del {
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--warm-3);font-size:15px;
  transition:all .15s;opacity:0;
}
.hist-session:hover .hist-session-del { opacity:1; }
.hist-session-del:hover { background:rgba(212,75,58,.1);color:var(--c-pests); }

/* ── LANG SHEET ── */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(11,10,8,.76);
  z-index: 200;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.sheet-overlay.open { display:flex; animation:fadeBg .22s ease forwards; }

.sheet {
  background: var(--white);
  width: 100%;
  border-radius: 22px 22px 0 0;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  animation: slideUp .3s cubic-bezier(.32,.72,0,1);
  max-height: 78dvh;
  display: flex;
  flex-direction: column;
}
.sheet-handle {
  width:32px;height:3px;
  background:#DDD6C8;border-radius:2px;
  margin:10px auto 0;flex-shrink:0;
}
.sheet-head {
  padding:16px 22px 14px;
  border-bottom:1px solid #EDE8DC;flex-shrink:0;
}
.sheet-title {
  font-family:'DM Serif Display',serif;
  font-size:18px;font-weight:400;color:var(--ink);
}
.sheet-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.sheet-scroll::-webkit-scrollbar { display:none; }

.lang-list { list-style:none;padding:6px 0 8px; }
.lang-item {
  display:flex;align-items:center;gap:13px;
  padding:13px 22px;cursor:pointer;transition:background .12s;
}
.lang-item:active,.lang-item.active { background:var(--warm-1); }
.lang-item .flag { font-size:22px;line-height:1; }
.lang-item-copy { flex:1; }
.lang-item-name { font-size:14px;font-weight:500;color:var(--ink); }
.lang-item-native { font-size:12px;color:var(--warm-4);margin-top:1px; }
.lang-check { color:var(--green);font-size:16px;opacity:0; }
.lang-item.active .lang-check { opacity:1; }

/* ── TOAST ── */
.toast {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--warm-2);
  font-size: 12.5px;
  padding: 9px 18px;
  border-radius: 100px;
  white-space: nowrap;
  opacity: 0;
  transition: all .3s cubic-bezier(.32,.72,0,1);
  z-index: 300;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── KEYFRAMES ── */
@keyframes fadeBg    { from{opacity:0}to{opacity:1} }
@keyframes slideUp   { from{transform:translateY(100%)}to{transform:translateY(0)} }
@keyframes msgIn     { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
@keyframes fadeUp    { from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)} }

function openSheet()  { document.getElementById('overlay').classList.add('open'); }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function outsideClose(e) { if(e.target===document.getElementById('overlay')) closeSheet(); }

function renderLangList() {
  document.getElementById('langList').innerHTML = LANGS.map(l=>`
    <li class="lang-item${l.c===lang?' active':''}" onclick="setLang('${l.c}')">
      <span class="flag">${l.f}</span>
      <div class="lang-item-copy">
        <div class="lang-item-name">${l.n}</div>
        <div class="lang-item-native">${l.nat}</div>
      </div>
      <span class="lang-check">✓</span>
    </li>`).join('');
}

function setLang(code) {
  lang = code;
  activeCat = 0;
  localStorage.setItem('tv_lang', code);
  const l = LANGS.find(x=>x.c===code);
  document.getElementById('hFlag').textContent = l.f;
  document.getElementById('hCode').textContent = code.toUpperCase();
  document.getElementById('langList').querySelectorAll('.lang-item').forEach((el,i)=>{
    el.classList.toggle('active', LANGS[i].c===code);
  });
  applyLang();
  setTimeout(closeSheet, 240);
}

/* ════════════ CATEGORIES ════════════ */
function renderCategories() {
  const cats = getCats(lang);
  activeCat  = Math.min(activeCat, cats.length-1);

  document.getElementById('catScroll').innerHTML = cats.map((c,i)=>`
    <button class="cat-chip${i===activeCat?' active':''}" onclick="selectCat(${i})">
      <span class="chip-icon">${c.icon}</span>${c.label}
    </button>`).join('');

  renderPrompts(cats[activeCat]);

  // scroll active chip into view
  requestAnimationFrame(()=>{
    const scroll = document.getElementById('catScroll');
    const active = scroll.querySelector('.cat-chip.active');
    if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
  });
}

function renderPrompts(cat) {
  document.getElementById('qsGrid').innerHTML = cat.qs.map(q=>`
    <button class="q-btn" data-cat="${cat.id}" onclick="useQ(this)">
      <span class="q-icon">${q.i}</span>
      <span class="q-text">${q.t}</span>
    </button>`).join('');
}

function selectCat(i) {
  activeCat = i;
  renderCategories();
}

function useQ(btn) {
  const text = btn.querySelector('.q-text').textContent;
  document.getElementById('inp').value = text;
  send();
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 96)+'px';
}
function onKey(e) {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}

function fmtTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function fmtDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if(diff < 86400000 && d.getDate()===now.getDate()) return 'Today';
  if(diff < 172800000) return 'Yesterday';
  return d.toLocaleDateString(undefined, {month:'short',day:'numeric'});
}

function getResponse() {
  const arr = RESPONSES[lang] || RESPONSES.en;
  return arr[Math.floor(Math.random()*arr.length)];
}

function addMsgEl(text, who, time) {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.className = `row ${who}`;

  const av  = document.createElement('div');
  av.className = `av ${who}`;
  av.textContent = who==='ai' ? '✦' : '↑';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:2px;max-width:80%';

  const bub  = document.createElement('div');
  bub.className = 'bubble';
  bub.style.maxWidth = '100%';
  bub.textContent = text;

  const t = document.createElement('div');
  t.className = 'msg-time';
  t.textContent = time || fmtTime();

  wrap.appendChild(bub);
  wrap.appendChild(t);

  if(who==='user'){ row.appendChild(wrap); row.appendChild(av); }
  else            { row.appendChild(av);   row.appendChild(wrap); }

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'av ai'; av.textContent = '✦';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  row.appendChild(av); row.appendChild(bub);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

async function send() {
  if(typing) return;
  const inp  = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;

  inp.value = '';
  inp.style.height = 'auto';

  const time = fmtTime();

  if(msgs.length===0) {
    document.getElementById('welcomeCard').style.cssText = 'opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none';
    document.getElementById('qsWrap').style.cssText      = 'opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none';
    setTimeout(()=>{
      document.getElementById('welcomeCard').style.display = 'none';
      document.getElementById('qsWrap').style.display      = 'none';
    }, 260);
  }

  msgs.push({role:'user', text, time});
  addMsgEl(text, 'user', time);

  typing = true;
  document.getElementById('sendBtn').disabled = true;

  showTyping();
  await new Promise(r=>setTimeout(r, 1100+Math.random()*900));
  removeTyping();

  const reply = getResponse();
  const rtime = fmtTime();
  msgs.push({role:'ai', text:reply, time:rtime});
  addMsgEl(reply, 'ai', rtime);

  typing = false;
  document.getElementById('sendBtn').disabled = false;

  // auto-save session
  saveSession();
  updateHistBadge();
}

function newChat() {
  // save current chat first
  if(msgs.length>0) saveSession();

  msgs       = [];
  currentSID = null;
  typing     = false;
  document.getElementById('sendBtn').disabled = false;

  const chat = document.getElementById('chat');
  chat.querySelectorAll('.row').forEach(r=>r.remove());

  const wc = document.getElementById('welcomeCard');
  const qw = document.getElementById('qsWrap');
  wc.style.display = '';
  qw.style.display = '';
  wc.style.cssText = '';
  qw.style.cssText = '';

  activeCat = 0;
  renderCategories();
  chat.scrollTop = 0;

  showToast( STR[lang]?.nc || 'New conversation' );
}

/* ════════════ SESSION STORAGE ════════════ */
function saveSession() {
  if(msgs.length === 0) return;
  const preview = msgs[0].text;
  const ts      = Date.now();

  if(currentSID) {
    const idx = sessions.findIndex(s=>s.id===currentSID);
    if(idx !== -1) {
      sessions[idx] = { id:currentSID, ts, preview, msgs:[...msgs] };
    } else {
      currentSID = null;
    }
  }

  if(!currentSID) {
    currentSID = 'sid_'+ts;
    sessions.unshift({ id:currentSID, ts, preview, msgs:[...msgs] });
    if(sessions.length > 50) sessions = sessions.slice(0,50);
  }

  localStorage.setItem('tv_sessions', JSON.stringify(sessions));
}

function loadSession(sid) {
  const s = sessions.find(x=>x.id===sid);
  if(!s) return;

  // save current first
  if(msgs.length>0) saveSession();

  msgs = [...s.msgs];
  currentSID = sid;

  const chat = document.getElementById('chat');
  chat.querySelectorAll('.row').forEach(r=>r.remove());

  document.getElementById('welcomeCard').style.display = 'none';
  document.getElementById('qsWrap').style.display      = 'none';

  msgs.forEach(m => addMsgEl(m.text, m.role, m.time));
  goChat();
}

function deleteSession(sid, e) {
  e.stopPropagation();
  sessions = sessions.filter(s=>s.id!==sid);
  localStorage.setItem('tv_sessions', JSON.stringify(sessions));
  if(currentSID===sid){ msgs=[]; currentSID=null; }
  renderHistory();
  updateHistBadge();
}

function clearAll() {
  if(sessions.length===0) return;
  sessions=[]; currentSID=null; msgs=[];
  localStorage.setItem('tv_sessions','[]');
  renderHistory();
  updateHistBadge();
  showToast('Cleared');
}

function updateHistBadge() {
  const badge = document.getElementById('histBadge');
  const n = sessions.length;
  badge.textContent = n>9?'9+':String(n);
  badge.classList.toggle('show', n>0);
}

function renderHistory() {
  const list = document.getElementById('histList');
  if(sessions.length===0){
    const s = STR[lang]||STR.en;
    list.innerHTML = `<div class="hist-empty">
      <div class="hist-empty-icon">🌱</div>
      <div class="hist-empty-text">${s.histEmpty.replace('\n','<br>')}</div>
    </div>`;
    return;
  }
  list.innerHTML = sessions.map((s,i)=>`
    <div class="hist-session" style="animation-delay:${i*0.04}s" onclick="loadSession('${s.id}')">
      <div class="hist-session-top">
        <span class="hist-session-date">${fmtDate(s.ts)}</span>
        <span class="hist-session-count">${s.msgs.length} msg${s.msgs.length!==1?'s':''}</span>
      </div>
      <div class="hist-session-preview">${escHtml(s.preview)}</div>
      <button class="hist-session-del" onclick="deleteSession('${s.id}',event)" title="Delete">✕</button>
    </div>`).join('');
}

function escHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ════════════ TOAST ════════════ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ════════════ START ════════════ */
init();
</script>
