<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Terrova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --ink:     #0B0A08;
  --ink-2:   #181510;
  --ink-3:   #252119;
  --warm-5:  #3E3829;
  --warm-4:  #6B6250;
  --warm-3:  #9E9278;
  --warm-2:  #D4C9B0;
  --warm-1:  #EDE8DC;
  --canvas:  #F5F1E8;
  --white:   #FFFFFF;
  --earth:   #5C3D1E;
  --green:   #1F5C3A;
  --green-2: #2E7A52;
  --green-3: #4EA876;
  --green-l: #E4F0EA;
  --gold:    #A67C2E;
  --gold-l:  #F0E4B0;
  --rust:    #8B3A1A;
  --rust-l:  #F5E5DE;
  --blue:    #1A3C5C;
  --blue-l:  #DDE8F0;
  --r: 14px;
  --r-lg: 20px;
  --r-xl: 26px;
}

html, body { height: 100%; background: var(--ink); overflow: hidden; }

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--canvas);
  position: relative;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
}

/* ─── HEADER ─── */
.hdr {
  background: var(--ink);
  padding: 14px 18px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.hdr::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(78,168,118,0.3), transparent);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── LOGO MARK: terrain contour ─── */
.logo-mark {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
}

.logo-wordmark {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.logo-name {
  font-family: 'DM Serif Display', serif;
  font-size: 21px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: -0.01em;
  line-height: 1;
}

.logo-sub {
  font-size: 9px;
  font-weight: 400;
  color: var(--green-3);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ─── LANG BUTTON ─── */
.lang-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 100px;
  padding: 6px 12px 6px 9px;
  cursor: pointer;
  color: var(--warm-2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.03em;
  transition: background 0.15s;
}
.lang-pill:active { background: rgba(255,255,255,0.10); }
.lang-pill .flag { font-size: 14px; line-height: 1; }
.lang-pill .chevron { opacity: 0.35; font-size: 9px; margin-left: 1px; }

/* ─── LANG SHEET ─── */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: rgba(11,10,8,0.76);
  z-index: 100;
  display: none;
  align-items: flex-end;
  backdrop-filter: blur(6px);
}
.sheet-overlay.open { display: flex; animation: fadeBg 0.22s ease forwards; }

.sheet {
  background: var(--white);
  width: 100%;
  border-radius: 22px 22px 0 0;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  animation: slideUp 0.28s cubic-bezier(.32,.72,0,1);
  max-height: 78dvh;
  display: flex;
  flex-direction: column;
}

.sheet-handle {
  width: 32px; height: 3px;
  background: #DDD6C8;
  border-radius: 2px;
  margin: 10px auto 0;
  flex-shrink: 0;
}

.sheet-head {
  padding: 16px 22px 14px;
  border-bottom: 1px solid #EDE8DC;
  flex-shrink: 0;
}

.sheet-title {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--ink);
}

.sheet-scroll { overflow-y: auto; flex: 1; }
.sheet-scroll::-webkit-scrollbar { display: none; }

.lang-list { list-style: none; padding: 6px 0 8px; }

.lang-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 22px;
  cursor: pointer;
  transition: background 0.12s;
}
.lang-item:active, .lang-item.active { background: var(--warm-1); }
.lang-item .flag { font-size: 22px; line-height: 1; }
.lang-item-copy { flex: 1; }
.lang-item-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.lang-item-native { font-size: 12px; color: var(--warm-4); margin-top: 1px; }
.lang-check { color: var(--green); font-size: 16px; opacity: 0; }
.lang-item.active .lang-check { opacity: 1; }

/* ─── CHAT SCROLL ─── */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 15px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { display: none; }

/* ─── WELCOME ─── */
.welcome {
  background: var(--ink-2);
  border-radius: var(--r-xl);
  padding: 20px 18px 18px;
  position: relative;
  overflow: hidden;
  margin-bottom: 2px;
}

.welcome::before {
  content: '';
  position: absolute;
  right: -40px; top: -40px;
  width: 130px; height: 130px;
  border-radius: 50%;
  border: 1px solid rgba(78,168,118,0.08);
}
.welcome::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 1px solid rgba(78,168,118,0.12);
}

.welcome-kova {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.kova-dot {
  width: 7px; height: 7px;
  background: var(--green-3);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(78,168,118,0.2);
  flex-shrink: 0;
  animation: pulse 2.5s infinite;
}

.kova-label {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--warm-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.welcome-msg {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--white);
  line-height: 1.40;
  margin-bottom: 10px;
}

.welcome-sub {
  font-size: 13px;
  font-weight: 300;
  color: var(--warm-3);
  line-height: 1.65;
}

/* ─── CATEGORY NAV ─── */
.cat-section {
  margin-bottom: 4px;
}

.cat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--warm-4);
  padding: 0 2px;
  margin-bottom: 10px;
}

.cat-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
  scrollbar-width: none;
}
.cat-scroll::-webkit-scrollbar { display: none; }

.cat-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 100px;
  border: 1.5px solid #DDD7C9;
  background: var(--white);
  cursor: pointer;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 400;
  color: var(--warm-5);
  transition: all 0.15s;
  flex-shrink: 0;
}
.cat-chip .chip-icon { font-size: 13px; line-height: 1; }
.cat-chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--white);
}
.cat-chip:active { transform: scale(0.95); }

/* ─── QUICK PROMPTS ─── */
.qs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 4px;
}

.q-btn {
  background: var(--white);
  border: 1px solid #E5DFD1;
  border-radius: var(--r);
  padding: 12px 12px 11px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s;
}
.q-btn:active { background: var(--green-l); border-color: var(--green-3); transform: scale(0.975); }
.q-icon { font-size: 16px; line-height: 1; }
.q-text { font-size: 12px; font-weight: 400; color: var(--ink-3); line-height: 1.4; }

/* category color accents */
.q-btn[data-cat="pests"] { border-left: 3px solid #D44B3A; }
.q-btn[data-cat="soil"] { border-left: 3px solid #8B5C2A; }
.q-btn[data-cat="water"] { border-left: 3px solid #2A6EA6; }
.q-btn[data-cat="harvest"] { border-left: 3px solid #C4951A; }
.q-btn[data-cat="market"] { border-left: 3px solid #2A7A52; }
.q-btn[data-cat="weather"] { border-left: 3px solid #5A6FA6; }
.q-btn[data-cat="organic"] { border-left: 3px solid #4A8C3A; }
.q-btn[data-cat="seeds"] { border-left: 3px solid #9A6B2A; }
.q-btn[data-cat="livestock"] { border-left: 3px solid #A64040; }
.q-btn[data-cat="tools"] { border-left: 3px solid #4A4A5E; }
.q-btn[data-cat="veggies"] { border-left: 3px solid #3A8C3A; }
.q-btn[data-cat="grains"] { border-left: 3px solid #C4A050; }
.q-btn[data-cat="spices"] { border-left: 3px solid #C44A20; }
.q-btn[data-cat="fruits"] { border-left: 3px solid #C43A6A; }
.q-btn[data-cat="ornamental"] { border-left: 3px solid #7A4AC4; }
.q-btn[data-cat="analysis"] { border-left: 3px solid #1A6C8C; }
.q-btn[data-cat="disease"] { border-left: 3px solid #8C3A4A; }
.q-btn[data-cat="composting"] { border-left: 3px solid #6C7A3A; }

/* ─── MESSAGES ─── */
.row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: msgIn 0.2s ease;
}
.row.user { flex-direction: row-reverse; }

.av {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.av.ai { background: var(--ink); }
.av.user { background: var(--green); }

.bubble {
  max-width: 80%;
  padding: 11px 14px;
  font-size: 13.5px;
  line-height: 1.65;
  word-break: break-word;
}

.row.ai .bubble {
  background: var(--white);
  color: var(--ink);
  border-radius: 16px 16px 16px 4px;
  box-shadow: 0 1px 8px rgba(11,10,8,0.07);
}

.row.user .bubble {
  background: var(--ink);
  color: var(--warm-2);
  border-radius: 16px 16px 4px 16px;
  font-weight: 300;
}

/* ─── TYPING ─── */
.typing-dots {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 4px 2px;
}
.dot {
  width: 5px; height: 5px;
  background: var(--warm-3);
  border-radius: 50%;
  animation: blink 1.3s infinite;
}
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }

/* ─── INPUT AREA ─── */
.input-wrap {
  background: var(--white);
  border-top: 1px solid #EAE4D8;
  padding: 11px 15px;
  padding-bottom: max(13px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}

.new-chat {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--warm-4);
  letter-spacing: 0.05em;
  margin-bottom: 9px;
  padding: 0;
  transition: color 0.15s;
}
.new-chat:active { color: var(--green); }
.new-chat svg { opacity: 0.55; }

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  background: var(--warm-1);
  border: 1.5px solid #DAD2BE;
  border-radius: 22px;
  padding: 9px 9px 9px 15px;
  transition: border-color 0.2s;
}
.input-row:focus-within { border-color: var(--green-2); }

textarea.inp {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  resize: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.5;
  max-height: 96px;
  min-height: 22px;
  -webkit-appearance: none;
}
textarea.inp::placeholder { color: var(--warm-3); }

.send {
  width: 36px; height: 36px;
  background: var(--ink);
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.send:active { background: var(--green); transform: scale(0.92); }
.send:disabled { background: var(--warm-2); }
.send svg { width: 15px; height: 15px; }

/* ─── ANIMATIONS ─── */
@keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(78,168,118,0.2); } 50% { box-shadow: 0 0 0 5px rgba(78,168,118,0.08); } }

@media (min-width: 431px) {
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #app { border-radius: 38px; overflow: hidden; height: 840px; max-height: 96dvh; box-shadow: 0 36px 100px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03); }
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo">
      <!-- TERROVA LOGO: terrain contour mark -->
      <svg class="logo-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- background field -->
        <rect width="34" height="34" rx="9" fill="#181510"/>
        <!-- terrain contour layers (bottom to top) -->
        <path d="M4 26 Q8.5 23 12 25 Q15.5 27 17 24 Q19 21 22 23 Q25 25 30 22 L30 30 L4 30 Z" fill="#1F5C3A" opacity="0.9"/>
        <path d="M4 23 Q7 19.5 11 21 Q14 22.5 17 19 Q20 15.5 23 18 Q26 20.5 30 17 L30 25 Q25.5 22.5 22.5 21 Q19.5 19.5 17 22 Q14.5 24.5 11.5 23 Q8.5 21.5 4 25 Z" fill="#2E7A52" opacity="0.8"/>
        <path d="M4 19 Q7.5 15 12 17 Q15 18.5 17 15 Q19 11.5 22.5 14 Q26 16.5 30 13 L30 20 Q26 17 22.5 16.5 Q19.5 16 17 19 Q14.5 22 11.5 20 Q8.5 18 4 22 Z" fill="#4EA876" opacity="0.6"/>
        <!-- horizon line accent -->
        <line x1="4" y1="13" x2="30" y2="13" stroke="rgba(78,168,118,0.2)" stroke-width="0.5"/>
        <!-- small sun / growth indicator -->
        <circle cx="25" cy="9" r="2.5" fill="#A67C2E" opacity="0.85"/>
        <line x1="25" y1="5.5" x2="25" y2="4" stroke="#A67C2E" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
        <line x1="27.6" y1="6.4" x2="28.7" y2="5.3" stroke="#A67C2E" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
        <line x1="28.5" y1="9" x2="30" y2="9" stroke="#A67C2E" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <div class="logo-wordmark">
        <div class="logo-name">Terrova</div>
        <div class="logo-sub">Smart Farming</div>
      </div>
    </div>

    <button class="lang-pill" onclick="openSheet()">
      <span class="flag" id="hFlag">🇬🇧</span>
      <span id="hCode">EN</span>
      <span class="chevron">▾</span>
    </button>
  </header>

  <!-- CHAT -->
  <div class="chat" id="chat">

    <div class="welcome" id="welcomeCard">
      <div class="welcome-kova">
        <div class="kova-dot"></div>
        <div class="kova-label">Kova is online</div>
      </div>
      <div class="welcome-msg" id="wMsg">Hey there, farmer. What's growing today?</div>
      <div class="welcome-sub" id="wSub">Ask me anything about your crops, soil, pests, or harvest. I'll give you straight, practical advice.</div>
    </div>

    <div id="qsWrap">
      <div class="cat-section">
        <div class="cat-label" id="catLabel">Browse categories</div>
        <div class="cat-scroll" id="catScroll"></div>
        <div class="qs-grid" id="qsGrid"></div>
      </div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <button class="new-chat" onclick="newChat()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newLabel">New conversation</span>
    </button>
    <div class="input-row">
      <textarea class="inp" id="inp" rows="1"
        placeholder="Ask about your crops..."
        oninput="resize(this)"
        onkeydown="onKey(event)"></textarea>
      <button class="send" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- LANG SHEET -->
  <div class="sheet-overlay" id="overlay" onclick="outsideClose(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title">Language</div>
      </div>
      <div class="sheet-scroll">
        <ul class="lang-list" id="langList"></ul>
      </div>
    </div>
  </div>

</div>
<script>
const LANGS = [
  { c:'en', f:'🇬🇧', n:'English',    nat:'English' },
  { c:'id', f:'🇮🇩', n:'Indonesian', nat:'Bahasa Indonesia' },
  { c:'es', f:'🇪🇸', n:'Spanish',    nat:'Español' },
  { c:'hi', f:'🇮🇳', n:'Hindi',      nat:'हिन्दी' },
  { c:'fr', f:'🇫🇷', n:'French',     nat:'Français' },
  { c:'pt', f:'🇧🇷', n:'Portuguese', nat:'Português' },
  { c:'ja', f:'🇯🇵', n:'Japanese',   nat:'日本語' },
  { c:'sw', f:'🇰🇪', n:'Swahili',    nat:'Kiswahili' },
  { c:'bn', f:'🇧🇩', n:'Bengali',    nat:'বাংলা' },
  { c:'vi', f:'🇻🇳', n:'Vietnamese', nat:'Tiếng Việt' },
  { c:'th', f:'🇹🇭', n:'Thai',       nat:'ภาษาไทย' },
  { c:'tl', f:'🇵🇭', n:'Tagalog',    nat:'Tagalog' },
  { c:'am', f:'🇪🇹', n:'Amharic',    nat:'አማርኛ' },
  { c:'my', f:'🇲🇲', n:'Burmese',    nat:'မြန်မာဘာသာ' },
  { c:'tr', f:'🇹🇷', n:'Turkish',    nat:'Türkçe' },
];

/* ─── CATEGORIES ─── */
const CATEGORIES = {
  en: [
    { id:'pests',      icon:'🪲', label:'Pests',       qs:[{i:'🪲',t:'How to control aphids on cabbage?'},{i:'🐛',t:'Best organic spray for caterpillars?'},{i:'🐀',t:'Rodent control in rice fields?'},{i:'🦟',t:'How to stop thrips on chili plants?'},{i:'🐌',t:'Keep slugs away from seedlings?'},{i:'🪳',t:'Whitefly on tomatoes — what to do?'}] },

// fallback: use 'en' categories for langs without specific cats
const getCats = (lang) => CATEGORIES[lang] || CATEGORIES['en'];

let lang = 'en';
let activeCat = 0;
let msgs = [];
let typing = false;

/* ─── INIT ─── */
function init() {
  renderLangList();
  renderCategories();
  applyLang();
}

function applyLang() {
  const s = STR[lang] || STR.en;
  document.getElementById('wMsg').textContent = s.msg;
  document.getElementById('wSub').textContent = s.sub;
  document.getElementById('catLabel').textContent = s.catLabel;
  document.getElementById('newLabel').textContent = s.nc;
  document.getElementById('inp').placeholder = s.ph;
  document.title = 'Terrova';
  renderCategories();
}

function renderLangList() {
  const ul = document.getElementById('langList');
  ul.innerHTML = LANGS.map(l => `
    <li class="lang-item${l.c===lang?' active':''}" onclick="setLang('${l.c}')">
      <span class="flag">${l.f}</span>
      <div class="lang-item-copy">
        <div class="lang-item-name">${l.n}</div>
        <div class="lang-item-native">${l.nat}</div>
      </div>
      <span class="lang-check">✓</span>
    </li>`).join('');
}

function renderCategories() {
  const cats = getCats(lang);
  activeCat = Math.min(activeCat, cats.length - 1);

  // chips
  const scroll = document.getElementById('catScroll');
  scroll.innerHTML = cats.map((cat, i) => `
    <button class="cat-chip${i===activeCat?' active':''}" onclick="selectCat(${i})">
      <span class="chip-icon">${cat.icon}</span>${cat.label}
    </button>`).join('');

  // prompts
  renderPrompts(cats[activeCat]);
}

function renderPrompts(cat) {
  const grid = document.getElementById('qsGrid');
  grid.innerHTML = cat.qs.map(q => `
    <button class="q-btn" data-cat="${cat.id}" onclick="useQ(this)">
      <span class="q-icon">${q.i}</span>
      <span class="q-text">${q.t}</span>
    </button>`).join('');
}

function selectCat(i) {
  activeCat = i;
  renderCategories();
}

function useQ(btn) {
  const text = btn.querySelector('.q-text').textContent;
  document.getElementById('inp').value = text;
  send();
}

/* ─── LANG SHEET ─── */
function openSheet() { document.getElementById('overlay').classList.add('open'); }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function outsideClose(e) { if(e.target===document.getElementById('overlay')) closeSheet(); }

function setLang(code) {
  lang = code;
  activeCat = 0;
  const l = LANGS.find(x=>x.c===code);
  document.getElementById('hFlag').textContent = l.f;
  document.getElementById('hCode').textContent = l.c.toUpperCase();
  document.getElementById('langList').querySelectorAll('.lang-item').forEach((el,i)=>{
    el.classList.toggle('active', LANGS[i].c===code);
  });
  applyLang();
  setTimeout(closeSheet, 220);
}

/* ─── CHAT ─── */
function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 96) + 'px';
}

function onKey(e) {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

const RESPONSES = {
  en: [
    "Great question! Based on common farming practices, here's what you should know: start by observing the symptoms closely — timing and pattern matter a lot. Early intervention usually gives the best results.",
    "Farmers in similar conditions have found that the key is consistency. Whether it's watering schedule or pest management, regularity is more important than intensity.",
    "This depends on your soil type and local climate. Generally, testing your soil pH first gives you a clear direction. Most crops prefer a pH between 6.0 and 7.0.",
    "The best approach here is integrated — combine organic methods with good timing. Chemical solutions should always be the last resort, not the first.",
    "For your region, the timing is crucial. Plan 2-3 weeks ahead of the expected season change. Preparation now means a better harvest later.",
  ],
  id: [
    "Pertanyaan bagus! Berdasarkan praktik pertanian yang umum, ini yang perlu kamu ketahui: mulailah dengan mengamati gejala secara dekat — waktu dan pola sangat penting.",
    "Petani dalam kondisi serupa menemukan bahwa kuncinya adalah konsistensi. Baik jadwal penyiraman maupun pengendalian hama, keteraturan lebih penting dari intensitas.",
    "Ini tergantung pada jenis tanah dan iklim lokalmu. Secara umum, uji pH tanah terlebih dahulu memberi arahan yang jelas. Sebagian besar tanaman menyukai pH antara 6,0 dan 7,0.",
    "Pendekatan terbaik di sini adalah terpadu — kombinasikan metode organik dengan waktu yang tepat. Solusi kimia harus selalu menjadi pilihan terakhir.",
    "Untuk daerahmu, waktunya sangat penting. Rencanakan 2-3 minggu sebelum pergantian musim. Persiapan sekarang berarti panen yang lebih baik nanti.",
  ],
};

function getResponse() {
  const arr = RESPONSES[lang] || RESPONSES.en;
  return arr[Math.floor(Math.random()*arr.length)];
}

function addMsg(text, who) {
  msgs.push({text, who});
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = `row ${who}`;

  const av = document.createElement('div');
  av.className = `av ${who}`;
  av.textContent = who==='ai' ? '✦' : '↑';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  row.appendChild(av);
  row.appendChild(bub);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';

  const av = document.createElement('div');
  av.className = 'av ai';
  av.textContent = '✦';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  row.appendChild(av);
  row.appendChild(bub);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

async function send() {
  if(typing) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;

  inp.value = '';
  inp.style.height = 'auto';

  // hide welcome on first message
  if(msgs.length===0) {
    document.getElementById('welcomeCard').style.display='none';
    document.getElementById('qsWrap').style.display='none';
  }

  addMsg(text, 'user');
  typing = true;
  document.getElementById('sendBtn').disabled = true;

  showTyping();
  await new Promise(r=>setTimeout(r, 1200+Math.random()*800));
  removeTyping();

  addMsg(getResponse(), 'ai');
  typing = false;
  document.getElementById('sendBtn').disabled = false;
}

function newChat() {
  msgs = [];
  typing = false;
  document.getElementById('sendBtn').disabled = false;
  const chat = document.getElementById('chat');
  // remove all message rows
  chat.querySelectorAll('.row').forEach(r=>r.remove());
  document.getElementById('welcomeCard').style.display='';
  document.getElementById('qsWrap').style.display='';
  activeCat = 0;
  renderCategories();
}

init();
</script>
